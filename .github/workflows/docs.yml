name: docs

# Build the documentation with Jupyter Book (as `make build` in docs/). On main (a push, or "Run workflow" on main),
# also publish it to the gh-pages branch (as `make upload`), which GitHub Pages serves at
# https://cmt-mu.github.io/MultiPie/
# Pull requests and pushes to develop only check that the documentation builds.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the API pages import the package (autodoc), so it is installed with its dependencies.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "jupyter-book==1.0.4.post1"

      - name: Build
        run: make -C docs build

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      # the checkout is the git repository that ghp-import commits to and pushes from (with GITHUB_TOKEN).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: html
          path: ${{ runner.temp }}/html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -n: add .nojekyll, -f: replace the gh-pages branch by one commit of the new pages.
      - name: Publish to gh-pages
        run: |
          python -m pip install ghp-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import -n -p -f -m "Update documentation (${GITHUB_SHA::7})" "${{ runner.temp }}/html"
