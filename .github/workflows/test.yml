name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-xdist
      # run outside the checkout, so that the installed package (not the source tree) is tested.
      # -n auto: run the tests in parallel, one process per CPU core.
      - name: Test
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          python -c "import multipie, os, sys; f, w = os.path.realpath(multipie.__file__), os.path.realpath(os.environ['GITHUB_WORKSPACE']); print(f); sys.exit(os.path.commonpath([f, w]) == w)"
          python -m pytest -v -n auto -p no:cacheprovider "$GITHUB_WORKSPACE/tests"
